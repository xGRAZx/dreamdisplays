name: AltDisplays release

# Publishes an AltDisplays build (Dream Displays with the audiorange features) for the server owner
# and players: a GitHub release with just the Minecraft 1.21.11 mod (Fabric and NeoForge) and the Paper plugin, under a
# link that always points at the newest one (https://github.com/<owner>/dreamdisplays/releases/latest).
# Runs when ALTDISPLAYS_VERSION changes on the work branch or main (the release then creates the
# alt-<version> tag itself), for `alt-<version>` tags, or from the Actions tab with a version,
# after the same build and smoke tests as CI.
# A PR that changes this file runs everything except the publish step, as a dry run.
on:
  push:
    branches:
      - main
      - claude/project-thread-6cn8s0
    paths:
      - ALTDISPLAYS_VERSION
    tags:
      - 'alt-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'AltDisplays version, like 1.0'
        required: true
  pull_request:
    paths:
      - .github/workflows/audiorange-release.yml

concurrency:
  group: audiorange-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-tag:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1

      - name: Read the version
        id: check
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          build=$(sed -n 's/^ *const val BUILD = \([0-9]\+\)$/\1/p' \
            shared/src/main/kotlin/com/dreamdisplays/shared/audiorange/AudioRangeProtocol.kt)
          if [ -z "$build" ]; then
            echo "::error::AudioRangeProtocol.BUILD not found."
            exit 1
          fi
          release=0.0-dryrun
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            release="$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            release="${GITHUB_REF_NAME#alt-}"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            release=$(tr -d '[:space:]' < ALTDISPLAYS_VERSION)
          fi
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            if ! printf '%s' "$release" | grep -Eq '^[0-9]+(\.[0-9]+)+$'; then
              echo "::error::Version '$release' is not like 1.0 (tag alt-1.0)."
              exit 1
            fi
            # The mod reports this version to the server, which compares it with the newest release.
            alt=$(sed -n 's/^ *const val ALT_VERSION = "\([^"]*\)"$/\1/p' \
              shared/src/main/kotlin/com/dreamdisplays/shared/audiorange/AudioRangeProtocol.kt)
            if [ "$alt" != "$release" ]; then
              echo "::error::AudioRangeProtocol.ALT_VERSION is '$alt' but this release is '$release'."
              exit 1
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    needs: check-tag
    uses: ./.github/workflows/_build.yml
    with:
      pull_request: false

  smoke:
    needs: build
    uses: ./.github/workflows/_smoke.yml
    with:
      version: ${{ needs.build.outputs.version }}
      stonecutter_versions: ${{ needs.build.outputs.build_stonecutter_versions }}
      paper_build_version: ${{ needs.build.outputs.paper_build_version }}

  release:
    name: Publish AltDisplays ${{ needs.check-tag.outputs.release }}
    runs-on: ubuntu-latest
    needs: [ check-tag, build, smoke ]
    permissions:
      contents: write
    env:
      MC: '1.21.11'
      BUILD: ${{ needs.check-tag.outputs.build }}
      RELEASE: ${{ needs.check-tag.outputs.release }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download the 1.21.11 jars
        uses: actions/download-artifact@v8.0.1
        with:
          name: build-jars-1.21.11
          path: jars

      - name: Name the files
        run: |
          # Players get only the mods (public release); the server plugin goes to a draft release
          # that only the repository owner can see.
          mkdir release private
          cp "jars/dreamdisplays-fabric-$MC-$VERSION.jar" "release/AltDisplays-$RELEASE-$MC-Fabric-by-GRAZ.jar"
          cp "jars/dreamdisplays-neoforge-$MC-$VERSION.jar" "release/AltDisplays-$RELEASE-$MC-NeoForge-by-GRAZ.jar"
          paper=$(ls jars/dreamdisplays-paper-*.jar | grep -Ev -- '-(sources|javadoc|dev-shadow)\.jar$' | head -1)
          if [ -z "$paper" ]; then
            echo "::error::No Paper plugin jar in build-jars-$MC."
            exit 1
          fi
          cp "$paper" "private/AltDisplays-$RELEASE-$MC-Paper-by-GRAZ.jar"
          ls -l release private

      - name: Write the release notes
        run: |
          cat > notes.md <<EOF
          **AltDisplays $RELEASE** для Minecraft $MC, автор GRAZ.

          Мод для гравців: дисплеї з відео на сервері. Завантажте **один** файл і покладіть його в папку \`mods\`:

          - \`AltDisplays-$RELEASE-$MC-Fabric-by-GRAZ.jar\`: якщо гра на Fabric.
          - \`AltDisplays-$RELEASE-$MC-NeoForge-by-GRAZ.jar\`: якщо гра на NeoForge.

          Перед встановленням видаліть старий файл AltDisplays (або Dream Displays) з папки \`mods\`.
          EOF
          cat > private-notes.md <<EOF
          Server plugin for **AltDisplays $RELEASE** (draft: only the repository owner sees it). Put it in \`plugins\`
          and use it with the AltDisplays $RELEASE mods. Audiorange build $BUILD, Dream Displays $VERSION.
          EOF

      - name: Publish the release
        if: github.event_name != 'pull_request'
        run: |
          gh release create "alt-$RELEASE" release/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AltDisplays $RELEASE (Minecraft $MC)" \
            --notes-file notes.md \
            --latest
          gh release create "alt-$RELEASE-plugin" private/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AltDisplays $RELEASE: server plugin (private)" \
            --notes-file private-notes.md \
            --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
