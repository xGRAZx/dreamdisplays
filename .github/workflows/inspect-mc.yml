name: Inspect Minecraft classes

# Manual helper for porting work: prints the members of Minecraft classes for a given version, so
# mixin targets and method names can be checked against the real game jar.
on:
  workflow_dispatch:
    inputs:
      mc:
        description: Minecraft version (26.x jars are unobfuscated; older ones print obfuscated names)
        required: true
        default: "26.1.2"
      classes:
        description: Space-separated class names, e.g. net.minecraft.client.gui.Gui
        required: true
        default: "net.minecraft.client.gui.Gui net.minecraft.client.gui.Hud"
  # Also runs on PRs that change this file, with the defaults, since a workflow that only exists on a
  # branch cannot be dispatched by hand.
  pull_request:
    paths:
      - .github/workflows/inspect-mc.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 25
          distribution: temurin

      - name: Download the client jar
        run: |
          url=$(curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(v["url"] for v in m["versions"] if v["id"]=="${{ inputs.mc || '26.1.2' }}"))')
          jar=$(curl -fsSL "$url" | python3 -c 'import json,sys; print(json.load(sys.stdin)["downloads"]["client"]["url"])')
          curl -fsSL -o client.jar "$jar"

      - name: Print class members
        run: |
          for cls in ${{ inputs.classes || 'net.minecraft.client.gui.Gui net.minecraft.client.gui.Hud' }}; do
            echo "::group::$cls"
            javap -p -cp client.jar "$cls" || echo "$cls: not found in ${{ inputs.mc || '26.1.2' }}"
            echo "::endgroup::"
            javap -p -cp client.jar "$cls" >> "$GITHUB_STEP_SUMMARY" 2>&1 || echo "$cls: not found" >> "$GITHUB_STEP_SUMMARY"
          done
