name: CI

# Runs on every push to main and every PR. Always builds and uploads artifacts,
# with no conditional/skipped jobs, so the check set is complete and consistent.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      pull_request: ${{ github.event_name == 'pull_request' }}

  smoke:
    needs: build
    uses: ./.github/workflows/_smoke.yml
    with:
      version: ${{ needs.build.outputs.version }}
      stonecutter_versions: ${{ needs.build.outputs.build_stonecutter_versions }}
      paper_build_version: ${{ needs.build.outputs.paper_build_version }}
