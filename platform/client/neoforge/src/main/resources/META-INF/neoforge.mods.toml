modLoader = "javafml"
loaderVersion = "[1,)"
license = "LGPL-3.0"
issueTrackerURL = "https://github.com/xGRAZx/dreamdisplays/issues"

[[mods]]

modId = "dreamdisplays"
version = "${version}"
displayName = "Dream Displays"
displayURL = "https://github.com/xGRAZx/dreamdisplays"
logoFile = "assets/dreamdisplays/icon.png"
authors = "GRAZ"
credits = "Based on Dream Displays by arnodoelinger, INotSleep, Kolyakot33 and Toffikk."
description = "AltDisplays by GRAZ: in-game screens with server-set sound range."

[[mixins]]
