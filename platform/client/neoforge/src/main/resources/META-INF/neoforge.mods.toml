side = "BOTH"

[[dependencies.dreamdisplays]]
modId = "luckperms"
type = "optional"
versionRange = "[5,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.dreamdisplays]]
modId = "cloth_config"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "CLIENT"
